name: Publish squad report

on:
  schedule:
    # Daily, so prices/team news/fixture data stay fresh in the run-up to
    # each gameweek's deadline. The CLI defaults to the next unplayed GW,
    # so no gameweek number needs to be hardcoded or updated here.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Gameweek to forecast (leave blank for the next unplayed GW)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e . -r requirements.txt

      - name: Preserve any previously-published transfers page
        # GitHub Pages deploys replace the entire site each time. This job
        # never regenerates transfers.html itself (that only happens via
        # the "Suggest my transfers" workflow, which needs your FPL team
        # ID) -- so without this step, this routine report refresh would
        # silently delete it from the live site. -f + `|| true`: fine if
        # it doesn't exist yet, nothing to preserve.
        run: |
          mkdir -p public
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/transfers.html" \
            -o public/transfers.html || true

      - name: Generate report
        run: |
          GW_FLAG=""
          if [ -n "${{ inputs.gameweek }}" ]; then
            GW_FLAG="--gameweek ${{ inputs.gameweek }}"
          fi
          python -m fpl_forecast recommend $GW_FLAG --html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
